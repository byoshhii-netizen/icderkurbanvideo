<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi — İÇDER Kurban Videoları</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo img { height: 56px; margin-bottom: 10px; }
    .login-logo h2 { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
    .login-logo p { font-size: 0.8rem; color: var(--text3); margin-top: 4px; }
    .login-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--r);
      padding: 10px 14px;
      color: var(--red);
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <img id="adminLogo" src="" alt="Logo" style="display:none">
    <h2>İÇDER Kurban Videoları</h2>
    <p>Admin Paneli</p>
  </div>
  <div class="login-error" id="loginError"></div>
  <form id="loginForm" onsubmit="girisYap(event)">
    <div class="form-group">
      <label class="form-label">Admin Şifresi</label>
      <input type="password" class="form-input" id="sifreInput" placeholder="Şifrenizi girin" autofocus>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Giriş Yap
    </button>
  </form>
  <div style="margin-top:20px; text-align:center;">
    <a href="/" style="font-size:0.8rem; color:var(--text3);">
      <i class="fas fa-arrow-left"></i> Siteye Dön
    </a>
  </div>
</div>

<script>
  // Logo yükle
  fetch('/api/admin/logo').then(r => r.json()).then(d => {
    if (d.admin_logo) {
      const img = document.getElementById('adminLogo');
      img.src = d.admin_logo;
      img.style.display = 'block';
    }
  }).catch(() => {});

  async function girisYap(e) {
    e.preventDefault();
    const sifre = document.getElementById('sifreInput').value.trim();
    if (!sifre) return;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş yapılıyor...';
    try {
      const r = await fetch('/api/admin/giris', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ sifre })
      });
      const d = await r.json();
      if (d.ok) {
        btn.innerHTML = '<i class="fas fa-check"></i> Yönlendiriliyor...';
        // Session cookie'nin set edilmesi için bekle
        await new Promise(res => setTimeout(res, 200));
        window.location.href = '/admin';
      } else {
        err.textContent = d.hata || 'Şifre yanlış';
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
        document.getElementById('sifreInput').select();
      }
    } catch (ex) {
      err.textContent = 'Bağlantı hatası: ' + ex.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
    }
  }
</script>
</body>
</html>
